name: MySQL image

# Publishes ghcr.io/<owner>/<repo>:mysql-latest, :mysql-<version> and
# :mysql-<sha> from master. Upstream sync calls this after it lands a merge.

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch to build
        required: true
        type: string

concurrency:
  group: docker-mysql
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compute tags
        id: tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          version=$(jq -r .version package.json)
          sha=$(git rev-parse --short HEAD)
          {
            echo "tags<<EOF"
            echo "$image:mysql-latest"
            echo "$image:mysql-$version"
            echo "$image:mysql-$sha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: DATABASE_TYPE=mysql
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=mysql
          cache-to: type=gha,mode=max,scope=mysql
